<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(content=~{::main}, pageTitle='View Abbreviation')}">
<main>
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/admin}">Abbreviations</a></li>
            <li class="breadcrumb-item active" th:text="${abbreviation.code}">API</li>
        </ol>
    </nav>

    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h2 class="mb-0" th:text="${abbreviation.code}">API</h2>
            <div>
                <a th:href="@{/admin/abbreviations/{id}/edit(id=${abbreviation.id})}"
                   class="btn btn-primary">Edit</a>
                <a th:href="@{/admin/abbreviations/{id}/translations/new(id=${abbreviation.id})}"
                   class="btn btn-outline-primary">Add Translation</a>
            </div>
        </div>
        <div class="card-body">
            <div class="row mb-3">
                <div class="col-md-6">
                    <small class="text-muted">Created</small>
                    <p th:text="${#temporals.format(abbreviation.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-01</p>
                </div>
                <div class="col-md-6">
                    <small class="text-muted">Updated</small>
                    <p th:text="${abbreviation.updatedAt != null ? #temporals.format(abbreviation.updatedAt, 'yyyy-MM-dd HH:mm') : '-'}">2024-01-01</p>
                </div>
            </div>

            <h4>Translations</h4>
            <div th:if="${#lists.isEmpty(abbreviation.translations)}" class="alert alert-info">
                No translations yet. <a th:href="@{/admin/abbreviations/{id}/translations/new(id=${abbreviation.id})}">Add one</a>.
            </div>

            <div th:unless="${#lists.isEmpty(abbreviation.translations)}" class="accordion" id="translationsAccordion">
                <div th:each="trans, stat : ${abbreviation.translations}" class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button" th:classappend="${stat.index > 0} ? 'collapsed'"
                                type="button" data-bs-toggle="collapse"
                                th:attr="data-bs-target='#collapse' + ${stat.index}">
                            <span class="badge bg-primary me-2" th:text="${trans.languageCode}">en</span>
                            <span th:text="${trans.shortDescription}">Short description</span>
                        </button>
                    </h2>
                    <div th:id="'collapse' + ${stat.index}"
                         class="accordion-collapse collapse"
                         th:classappend="${stat.index == 0} ? 'show'"
                         data-bs-parent="#translationsAccordion">
                        <div class="accordion-body">
                            <h6>Short Description</h6>
                            <p th:text="${trans.shortDescription}">Short description</p>

                            <h6>Long Description</h6>
                            <p th:text="${trans.longDescription ?: 'No long description provided.'}"
                               th:classappend="${trans.longDescription == null} ? 'text-muted'">Long description</p>

                            <hr>
                            <form th:action="@{/admin/abbreviations/{id}/translations/{lang}/delete(id=${abbreviation.id}, lang=${trans.languageCode})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('Are you sure you want to delete this translation?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Delete Translation</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/admin}" class="btn btn-outline-secondary">Back to List</a>
    </div>
</main>
</html>
