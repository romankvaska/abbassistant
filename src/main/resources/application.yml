spring:
  application:
    name: abb-assistant

  # Default profile uses H2 for easy local development
  datasource:
    url: jdbc:h2:mem:abbdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

---
# PostgreSQL profile for production/cloud deployment
spring:
  config:
    activate:
      on-profile: postgres

  main:
    lazy-initialization: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dbabbassistant}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:usr_abbassistant}
    password: ${SPRING_DATASOURCE_PASSWORD:AA123@456}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  thymeleaf:
    cache: true

# Disable unnecessary features for lower memory
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
